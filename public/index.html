<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Backrooms Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- HUD overlay -->
  <div id="hud">
    <!-- Top Left: identifiant caméra / niveau / lieu (éditables) -->
    <div id="hud-topleft">
      <span id="cam-id">CAMERA 07</span>
      <span id="cam-level">LEVEL 2</span>
      <span id="cam-location">THE BACKROOMS</span>
    </div>

    <!-- Top Right: date + heure -->
    <div id="hud-topright">
      <span id="hud-date">01/01/2026</span>
      <span id="hud-time">00:00:00</span>
    </div>

    <!-- Bottom Left: statut enregistrement -->
    <div id="hud-bottomleft">
      <span id="rec-status">STATUS: MONITORING</span>
    </div>
  </div>

  <!-- Toggle de mode -->
  <div id="mode-toggle">
    <button id="btn-mode-cam" class="mode-btn active" onclick="setMode('cam')">CAM</button>
    <button id="btn-mode-backrooms" class="mode-btn" onclick="setMode('backrooms')">BACKROOMS</button>
    <button id="btn-mode-backcam" class="mode-btn" onclick="setMode('backcam')">BACKCAM</button>
  </div>

  <!-- Contrôles flottants -->
  <div id="controls">
    <div id="ctrl-camera">
      <button id="btn-camera" title="Changer de caméra">⚙</button>
      <select id="camera-select"></select>
    </div>
    <div id="ctrl-fond">
      <button id="btn-fond" title="Choisir une image de fond">FOND</button>
      <button id="btn-fond-reset" title="Réinitialiser le fond">↺</button>
      <input type="file" id="fond-input" accept="image/*" multiple>
    </div>
    <button id="btn-rec" title="Enregistrer">⏺</button>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Vidéo source (masquée) -->
  <video id="video" playsinline muted></video>

  <script src="app.js?v=17"></script>
</body>
</html>
