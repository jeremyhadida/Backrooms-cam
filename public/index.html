<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Backrooms Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- HUD overlay -->
  <div id="hud">
    <!-- Top Left: identifiant caméra / niveau / lieu (éditables) -->
    <div id="hud-topleft">
      <span id="cam-id">CAMERA 07</span>
      <span id="cam-level">LEVEL 2</span>
      <span id="cam-location">THE BACKROOMS</span>
    </div>

    <!-- Top Right: date + heure -->
    <div id="hud-topright">
      <span id="hud-date">01/01/2026</span>
      <span id="hud-time">00:00:00</span>
    </div>

    <!-- Bottom Left: statut enregistrement -->
    <div id="hud-bottomleft">
      <span id="rec-status">STATUS: MONITORING</span>
    </div>
  </div>

  <!-- Contrôles flottants -->
  <div id="controls">
    <div id="ctrl-camera">
      <button id="btn-camera" title="Changer de caméra">⚙</button>
      <select id="camera-select"></select>
    </div>
    <button id="btn-rec" title="Enregistrer">⏺</button>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Vidéo source (masquée) -->
  <video id="video" playsinline muted></video>

  <script src="app.js?v=7"></script>
</body>
</html>
